# ebook-server 的 Nginx 站点模板（HTTPS 终止 + 反向代理 + 边缘限流）。
#
# 替换占位符后再安装：`book.example.com` 换成你的域名，证书路径按实际部署替换。
# 安装位置：/etc/nginx/sites-available/ebook-server.conf
# 启用：ln -s ../sites-available/ebook-server.conf /etc/nginx/sites-enabled/
# 校验：sudo nginx -t && sudo systemctl reload nginx
#
# 应用侧只监听 127.0.0.1:9090；后台管理 9091 不经过这里（SSH 隧道/VPN 直连回环）。

# ── 边缘限流 ────────────────────────────────────────────────────────────────
# 这些指令属于 http 上下文；sites-enabled/* 正是被 include 进 http 块，所以写在
# 站点文件顶部合法。限流键是 TCP 对端地址；若以后加 CDN/WAF，必须先用 real_ip
# 模块还原真实客户端 IP，否则所有请求会共用 CDN 节点的桶。
limit_req_zone $binary_remote_addr zone=ebook_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ebook_send:10m  rate=3r/m;
limit_req_zone $binary_remote_addr zone=ebook_write:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ebook_read:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=ebook_conn:10m;

limit_req_log_level warn;
limit_conn_log_level warn;
limit_req_status 429;
limit_conn_status 429;

# 访问日志带 request_time / upstream_time / 是否被边缘限流，便于排查慢请求与攻击。
log_format ebook_api '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time '
                     'rate_limited=$sent_http_x_rate_limited';

upstream ebook_api {
    server 127.0.0.1:9090;
    keepalive 32;
}

# ── HTTP → HTTPS（统一跳转到 apex）────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name book.example.com www.book.example.com;
    return 301 https://book.example.com$request_uri;
}

# ── www → apex ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.book.example.com;

    ssl_certificate     /etc/nginx/ssl/book.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/book.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    return 301 https://book.example.com$request_uri;
}

# ── 主站：只提供 APP API，不提供网站 ──────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name book.example.com;

    ssl_certificate     /etc/nginx/ssl/book.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/book.example.com.key;

    # modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling：减少客户端握手时对 CA 的额外查询；失败只记日志，不影响握手。
    # ssl_trusted_certificate 是证书商提供的 CA 链，与站点证书不是同一个文件。
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/ca-chain.crt;
    resolver 1.1.1.1 8.8.8.8 valid=300s;  # 换成你所在网络可达的递归 DNS
    resolver_timeout 5s;

    # HSTS 暂不加 includeSubDomains/preload：未来新增子域名不会被强制 HTTPS 误伤。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── 边缘缓冲区与超时 ────────────────────────────────────────────────────
    # 默认 1m 会把 5MB 头像直接挡在 413；普通 JSON 仍只允许 256k。
    client_max_body_size 256k;
    client_body_buffer_size 16k;
    client_header_buffer_size 8k;
    large_client_header_buffers 4 16k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 30s;
    keepalive_requests 1000;

    # 反代到本机应用：显式覆写代理头，避免客户端伪造 X-Forwarded-For。
    # 应用只信任 127.0.0.1/::1 的代理头（见 backend/router/router.go）。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    proxy_buffering on;
    proxy_buffers 16 8k;
    proxy_busy_buffers_size 16k;

    access_log /var/log/nginx/ebook-server.access.log ebook_api;
    error_log  /var/log/nginx/ebook-server.error.log warn;

    # 429/413 也回统一信封：客户端只认 {code,error,data}，HTTP 恒为 200。
    # 429 用 X-Rate-Limited 响应头留下可观测信号（访问日志的 rate_limited= 字段）；
    # 413 是体积超限不是频控，不打该头。
    error_page 429 =200 @ebook_rate_limited;
    error_page 413 =200 @ebook_payload_too_large;

    # 本机不提供网站/静态首页，任何未登记路径一律 404。
    location / {
        return 404;
    }

    # 健康检查不参与限流，避免监控探测被误伤。
    location = /health {
        access_log off;
        proxy_pass http://ebook_api;
    }

    # 登录：每 IP 10 次/分钟（应用侧还有 5 次失败锁账号）。
    location = /api/auth/login {
        limit_req zone=ebook_login burst=5 nodelay;
        limit_conn ebook_conn 10;
        proxy_pass http://ebook_api;
    }

    # 发码：每 IP 3 次/分钟（应用侧还有每邮箱 1 次/分钟、5 次/小时）。
    location = /api/auth/send-code {
        limit_req zone=ebook_send burst=2 nodelay;
        limit_conn ebook_conn 5;
        proxy_pass http://ebook_api;
    }
    location = /api/auth/forgot-password/send-code {
        limit_req zone=ebook_send burst=2 nodelay;
        limit_conn ebook_conn 5;
        proxy_pass http://ebook_api;
    }

    # 注册/重置沿用登录档 10 次/分钟；应用侧另有验证码与失败锁定规则。
    location = /api/auth/register {
        limit_req zone=ebook_login burst=3 nodelay;
        limit_conn ebook_conn 10;
        proxy_pass http://ebook_api;
    }
    location = /api/auth/forgot-password/reset {
        limit_req zone=ebook_login burst=3 nodelay;
        limit_conn ebook_conn 10;
        proxy_pass http://ebook_api;
    }

    # 头像上传：应用侧上限是 5MiB 文件 + 1MiB multipart 开销（6MiB）；这里留到 7m，
    # 让边缘比应用宽 1MiB，超限由应用返回统一业务信封而不是边缘截断。
    location = /api/uploads/avatar {
        client_max_body_size 7m;
        limit_req zone=ebook_write burst=5 nodelay;
        limit_conn ebook_conn 5;
        proxy_pass http://ebook_api;
    }

    # 其余 API：读多写少，按 IP 限流 + 并发连接上限。
    location ^~ /api/ {
        limit_req zone=ebook_read burst=20 nodelay;
        limit_conn ebook_conn 50;
        proxy_pass http://ebook_api;
    }

    # 头像静态资源也经应用暴露；边缘限流防止被当成免费图床刷。
    location ^~ /uploads/avatar/ {
        limit_req zone=ebook_read burst=50 nodelay;
        limit_conn ebook_conn 50;
        proxy_pass http://ebook_api;
    }

    # 公开面不存在后台与接口文档，显式 404（应用侧本来也没挂）。
    location ^~ /admin/ {
        return 404;
    }
    location ^~ /api-docs/ {
        return 404;
    }

    # 配置文件、数据库、日志、VCS 元数据即便被误放到 web 根也不可达。
    location = /config.yaml { return 404; }
    location = /ebook.db     { return 404; }
    location = /logs         { return 404; }
    location ~ /\.(?!well-known) {
        return 404;
    }

    # 限流/超限的统一信封。这两个 location 自己声明 add_header，因此不会继承
    # server 级别的安全头——全部五个头在这里逐个重复，少抄一个就是静默降级。
    # X-Rate-Limited 只属于 429：413 是体积超限不是频控，打这个头会误导排障。
    location @ebook_rate_limited {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Rate-Limited 1 always;
        add_header Retry-After 60 always;
        return 200 '{"code":"A0241","error":"请求过于频繁，请稍后再试","data":null}';
    }

    location @ebook_payload_too_large {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        return 200 '{"code":"A0400","error":"请求体过大","data":null}';
    }
}
