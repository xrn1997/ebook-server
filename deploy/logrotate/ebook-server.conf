# /etc/logrotate.d/ebook-server
#
# 仓库内文件名带 .conf（deploy/logrotate/ebook-server.conf），安装时去掉后缀；
# .conf 是为了躲开根 .gitignore 里「ebook-server」这条二进制忽略规则——
# 与目录同名的文件不显式豁免会被 git add 静默吞掉。
#
# 安装：
#   sudo install -o root -g root -m 644 deploy/logrotate/ebook-server.conf \
#       /etc/logrotate.d/ebook-server
#   sudo logrotate -d /etc/logrotate.d/ebook-server   # 先 dry-run
#
# zap 以 open file 方式写 logs/app.log 与 logs/error.log，不响应重开信号；
# copytruncate 让轮转不需要重启进程。被截断后文件偏移会留出空洞，但空洞不占
# 磁盘块，tail/检索仍可正常工作。
# copytruncate 不新建文件，所以没有 create 指令（它与 copytruncate 互斥，写了也无效）。
# maxsize：攻击流量下单日就能写满磁盘，仅靠 daily 不够——超过 50M 当天即转。
/opt/ebook-server/logs/*.log {
    daily
    maxsize 50M
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su ebook ebook
}
